[project]
name = "missync"
version = "0.1.0"
description = "Catch data changes before they break what depends on them."
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["data", "sql", "lineage", "migrations", "data-quality", "impact-analysis"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
]
# Upper bounds are the next major after the versions the test-suite runs against; sqlglot and duckdb change behaviour between majors.
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "sqlalchemy>=2.0,<3",
  "sqlglot>=30,<31",
  "duckdb>=2.0,<3",
  "jinja2>=3.1,<4",
  "cryptography>=42,<51",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
bigquery = ["google-cloud-bigquery>=3.20"]
snowflake = ["snowflake-connector-python>=3.10"]
files = ["pyarrow>=15"]
sample = ["pgserver>=0.1.4", "psycopg2-binary>=2.9"]
dev = ["pytest>=8", "pytest-cov>=5", "httpx>=0.27", "ruff>=0.5"]

[project.urls]
Homepage = "https://github.com/Aniket712/missync"
Source = "https://github.com/Aniket712/missync"
Issues = "https://github.com/Aniket712/missync/issues"

[project.scripts]
missync = "missync.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["missync*"]

[tool.setuptools.package-data]
missync = ["_static/**/*", "demo/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 150
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "UP017", "B008", "C408", "UP037", "UP045"]
