name: Release

# Push a tag like v0.1.0 to build the wheel (with the UI bundled) and attach it to a GitHub release.
# Publishing to PyPI is intentionally not automated here: add a PyPI "trusted publisher" and a publish step when you are ready.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install build
      - run: python scripts/build_release.py
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
