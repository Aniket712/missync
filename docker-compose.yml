services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: missync_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-admin_dev_only}
      POSTGRES_DB: shop
    volumes:
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U missync_admin -d shop"]
      interval: 5s
      retries: 10

  missync:
    build: .
    environment:
      MISSYNC_MODE: ${MISSYNC_MODE:-self-hosted}
      MISSYNC_DATA_DIR: /data
      MISSYNC_SECRET_KEY: ${MISSYNC_SECRET_KEY:-}
      MISSYNC_API_TOKEN: ${MISSYNC_API_TOKEN:-}
      # The port is published on 127.0.0.1 only, so listening on 0.0.0.0 inside the container is safe without a token.
      # If you publish it on other interfaces, set MISSYNC_API_TOKEN and remove this line.
      MISSYNC_ALLOW_INSECURE_BIND: "true"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - missync-data:/data
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
  missync-data:
